name: Generate video list

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan video folder with size
        run: |
          JSON_OUT="video-list.json"
          echo "[" > $JSON_OUT
          first=1
          for f in video/*.mp4; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              size=$(stat -c%s "$f")
              if [ $first -eq 1 ]; then
                first=0
              else
                echo "," >> $JSON_OUT
              fi
              echo "  {\"filename\": \"$name\", \"size\": $size}" >> $JSON_OUT
            fi
          done
          echo "]" >> $JSON_OUT
          cat $JSON_OUT

      - name: Commit json file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video-list.json
          git commit -m "auto update video-list.json" || echo "nothing to commit"
          git push origin main || echo "nothing to push"
