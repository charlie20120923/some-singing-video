name: Generate video list and thumbnails

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4          # ✅ 第一步：拉取代码

      - name: Setup ffmpeg                 # ✅ 第二步：安装 ffmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3

      - name: Scan and generate           # ✅ 第三步：用 ffmpeg 生成缩略图
        run: |
          mkdir -p thumbnails
          JSON_OUT="video-list.json"
          echo "[" > $JSON_OUT
          first=1
          for f in video/*.mp4; do
            if [ -f "$f" ]; then
              name=$(basename "$f")
              if [ $first -eq 1 ]; then first=0; else echo "," >> $JSON_OUT; fi
              echo "  \"$name\"" >> $JSON_OUT
              # 用 ffmpeg 生成缩略图
              base=$(basename "$f" .mp4)
              ffmpeg -ss 10 -i "$f" -frames:v 1 -q:v 2 "thumbnails/$base.jpg" -y
            fi
          done
          echo "]" >> $JSON_OUT

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add video-list.json thumbnails/
          git commit -m "auto update" || echo "nothing to commit"
          git push origin main
