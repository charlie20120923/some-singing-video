<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频库</title>
<style>
@font-face {
  font-family: 'MapleMono‑CN';
  src: url('https://cdn.jsdelivr.net/gh/charlie20120923/some-singing-video/MapleMono-CN-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0e1a;
  color:#b0d4ff;
  padding:24px 16px;
  font-family: 'MapleMono‑CN', system-ui, monospace;
  max-width:1200px;
  margin:0 auto;
  background-image:radial-gradient(circle at 50% 0%,#0a1a3a 0%,transparent 60%);
  min-height:100vh;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
  flex-wrap:wrap;
  gap:12px;
}
.page-title{
  font-weight:400;
  font-size:24px;
  color:#4a9eff;
  text-shadow:0 0 8px #1a7aff,0 0 16px #0066ff;
}
.stats-info{
  color:#5a9eff;
  font-size:14px;
  text-shadow:0 0 5px #1a6aff;
}
.search-box{
  margin-bottom:24px;
}
#search-input{
  width:100%;
  max-width:400px;
  background:#0e1525;
  border:1px solid #2a7aff;
  color:#7ab8ff;
  padding:10px 16px;
  border-radius:10px;
  font-family: 'MapleMono‑CN', monospace;
  font-size:15px;
  outline:none;
  text-shadow:0 0 4px #2a7aff;
  box-shadow:0 0 10px #1a6aff44;
}
#search-input::placeholder{
  color:#4a7aaa;
}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
}
.video-card{
  background:#0e1525;
  border:1px solid #2a7aff44;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
  text-decoration:none;
  color:inherit;
  display:block;
}
.video-card:hover{
  transform:translateY(-4px);
  box-shadow:0 0 22px #2a7aff70;
  border-color:#4a8aff;
}
.video-card .thumbnail{
  width:100%;
  aspect-ratio:16/9;
  background:#0a0f1a;
  border-radius:8px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#4a7aaa;
  font-size:48px;
  border:1px solid #1a3a5a;
}
.video-card .thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.video-card .filename{
  margin-top:10px;
  font-size:13px;
  color:#7ab8ff;
  word-break:break-all;
  text-shadow:0 0 6px #1a6aff66;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.video-card .filesize{
  font-size:12px;
  color:#4a7aaa;
  margin-top:4px;
}
.loading-wrap{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#5a9eff;
}
.spinner{
  width:42px;
  height:42px;
  border:3px solid #1a2a5a;
  border-top-color:#3a8aff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:0 auto 18px;
  box-shadow:0 0 12px #1a6aff;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}
.empty-tip{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#5a9eff;
}
</style>
</head>
<body>

<div class="header">
  <div class="page-title">📹 视频库</div>
  <div class="stats-info" id="stats">加载中...</div>
</div>

<div class="search-box">
  <input id="search-input" placeholder="搜索文件名...">
</div>

<div class="container" id="box">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div>读取视频列表中…</div>
  </div>
</div>

<script>
const USER = "charlie20120923";
const REPO = "some-singing-video";
const BRANCH = "main";
const CDN_BASE = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}`;

const box = document.getElementById("box");
const statsEl = document.getElementById("stats");
const searchInput = document.getElementById("search-input");
let allVideoList = [];

function formatSize(bytes){
  if(!bytes) return "未知";
  const units = ["B","KB","MB","GB"];
  let i = 0;
  while(bytes >= 1024 && i < units.length-1){
    bytes /= 1024;
    i++;
  }
  return bytes.toFixed(1) + " " + units[i];
}

function render(list){
  if(!Array.isArray(list) || list.length===0){
    box.innerHTML = `<div class="empty-tip">未找到视频</div>`;
    statsEl.innerText = "共 0 个视频";
    return;
  }
  statsEl.innerText = `共 ${list.length} 个视频`;

  let html = "";
  list.forEach(item=>{
    const src = `${CDN_BASE}/video/${item.filename}`;
    // 缩略图：尝试用视频第一帧（部分浏览器支持）
    const thumb = `${CDN_BASE}/thumbnails/${item.filename.replace(/\.[^.]+$/, '.jpg')}`;
    html += `
    <a class="video-card" href="player.html?id=${encodeURIComponent(item.filename)}">
      <div class="thumbnail">
        <img src="${thumb}" alt="${item.filename}" onerror="this.style.display='none';this.parentElement.innerHTML='🎬'">
      </div>
      <div class="filename">${item.filename}</div>
      <div class="filesize">${formatSize(item.size)}</div>
    </a>
    `;
  });
  box.innerHTML = html;
}

async function load(){
  try{
    const listUrl = `${CDN_BASE}/video-list.json`;
    const res = await fetch(listUrl);
    const data = await res.json();
    
    // 兼容两种格式
    if (Array.isArray(data) && data.length > 0) {
      if (typeof data[0] === 'string') {
        // 旧格式：["video1.mp4", "video2.mp4"]
        allVideoList = data.map(filename => ({ filename, size: 0 }));
      } else if (typeof data[0] === 'object' && data[0].filename) {
        // 新格式：[{"filename":"video1.mp4","size":12345}]
        allVideoList = data;
      } else {
        allVideoList = [];
      }
    } else {
      allVideoList = [];
    }
    
    render(allVideoList);
  }catch(err){
    box.innerHTML = `<div class="empty-tip">读取失败：${err.toString()}</div>`;
    statsEl.innerText = "获取视频信息失败";
  }
}

searchInput.addEventListener("input",(e)=>{
  const kw = e.target.value.trim().toLowerCase();
  const data = kw ? allVideoList.filter(item=>item.filename.toLowerCase().includes(kw)) : allVideoList;
  render(data);
});

load();
</script>
</body>
</html>
