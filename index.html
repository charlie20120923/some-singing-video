<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频播放器</title>
<style>
@font-face {
  font-family: 'MapleMono‑CN';
  src: url('https://cdn.jsdelivr.net/gh/charlie20120923/some-singing-video/MapleMono-CN-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0e1a;
  color:#b0d4ff;
  padding:24px 16px;
  font-family: 'MapleMono‑CN', system-ui, monospace;
  max-width:1300px;
  margin:0 auto;
  background-image:radial-gradient(circle at 50% 0%,#0a1a3a 0%,transparent 60%);
  min-height:100vh;
}
.page-title{
  text-align:center;
  margin-bottom:20px;
  font-weight:400;
  font-size:26px;
  color:#4a9eff;
  text-shadow: 0 0 8px #1a7aff,0 0 16px #0066ff;
  letter-spacing:2px;
}
.toolbar{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:center;
  gap:14px;
  max-width:700px;
  margin:0 auto 24px;
}
.search-box{
  flex:1;
  min-width:200px;
}
#search-input{
  width:100%;
  background:#0e1525;
  border:1px solid #2a7aff;
  color:#7ab8ff;
  padding:10px 16px;
  border-radius:10px;
  font-family: 'MapleMono‑CN', monospace;
  font-size:15px;
  outline:none;
  text-shadow:0 0 4px #2a7aff;
  box-shadow:0 0 10px #1a6aff44;
}
#search-input::placeholder{
  color:#4a7aaa;
}
.view-toggle{
  display:flex;
  gap:4px;
  background:#0e1525;
  border:1px solid #2a7aff44;
  border-radius:10px;
  padding:4px;
  flex-shrink:0;
}
.view-toggle button{
  background:transparent;
  border:none;
  color:#7ab8ff;
  padding:8px 18px;
  border-radius:7px;
  font-family: 'MapleMono‑CN', monospace;
  font-size:14px;
  cursor:pointer;
  transition:0.2s;
  text-shadow:0 0 4px #1a6aff44;
}
.view-toggle button.active{
  background:#1a2a5a;
  box-shadow:0 0 14px #2a7aff66;
  border:1px solid #3a8aff;
  color:#b0d4ff;
}
.view-toggle button:hover:not(.active){
  background:#142244;
}
.stats-info{
  text-align:center;
  margin-bottom:16px;
  color:#5a9eff;
  text-shadow:0 0 5px #1a6aff;
  font-size:15px;
}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
  gap:26px;
}
.video-card{
  background:#0e1525;
  border:1px solid #2a7aff44;
  border-radius:16px;
  padding:16px;
  box-shadow:0 0 12px #1a6aff33,0 4px 14px rgba(0,0,0,0.6);
  transition:transform 0.25s ease,box-shadow 0.25s ease;
}
.video-card:hover{
  transform:translateY(-4px);
  box-shadow:0 0 22px #2a7aff70,0 8px 24px rgba(0,0,0,0.75);
  border-color:#4a8aff;
}
.video-card video{
  width:100%;
  border-radius:10px;
  background:#0a0f1a;
  display:block;
}
.video-card .filename{
  margin-top:14px;
  font-size:14px;
  color:#7ab8ff;
  word-break:break-all;
  text-shadow:0 0 6px #1a6aff66;
}
.video-card .download-btn{
  display:inline-block;
  margin-top:12px;
  padding:7px 14px;
  background:#142244;
  border:1px solid #3a8aff;
  color:#7ab8ff;
  border-radius:8px;
  text-decoration:none;
  font-family: 'MapleMono‑CN', monospace;
  font-size:13px;
  text-shadow:0 0 4px #1a6aff;
  box-shadow:0 0 8px #1a6aff40;
  transition:0.2s;
}
.video-card .download-btn:hover{
  background:#1a2a5a;
  box-shadow:0 0 16px #2a7aff80;
}
.container.list-mode{
  display:block;
}
.container.list-mode .video-card{
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  gap:12px 20px;
  padding:12px 18px;
  margin-bottom:10px;
  border-radius:10px;
}
.container.list-mode .video-card video{
  width:180px;
  flex-shrink:0;
  border-radius:6px;
}
.container.list-mode .video-card .filename{
  margin:0;
  flex:1;
  min-width:120px;
  font-size:14px;
}
.container.list-mode .video-card .download-btn{
  margin:0;
  flex-shrink:0;
}
.loading-wrap{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#5a9eff;
  font-size:17px;
  text-shadow:0 0 6px #1a6aff;
}
.spinner{
  width:42px;
  height:42px;
  border:3px solid #1a2a5a;
  border-top-color:#3a8aff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:0 auto 18px;
  box-shadow:0 0 12px #1a6aff;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}
.empty-tip{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#5a9eff;
  text-shadow:0 0 6px #1a6aff;
  font-size:17px;
}
.container.list-mode .empty-tip{
  display:block;
}
</style>
</head>
<body>
<div class="page-title">视频播放器</div>

<div class="toolbar">
  <div class="search-box">
    <input id="search-input" placeholder="搜索文件名...">
  </div>
  <div class="view-toggle">
    <button class="active" data-view="grid">网格</button>
    <button data-view="list">列表</button>
  </div>
</div>

<div class="stats-info" id="stats">正在统计视频数量...</div>

<div class="container" id="box">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div>读取视频列表中…</div>
  </div>
</div>

<script>
const USER = "charlie20120923";
const REPO = "some-singing-video";
const BRANCH = "main";
const CDN_BASE = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}`;

const box = document.getElementById("box");
const statsEl = document.getElementById("stats");
const searchInput = document.getElementById("search-input");
let allVideoList = [];
let currentView = "grid";

document.querySelectorAll(".view-toggle button").forEach(btn => {
  btn.addEventListener("click", function() {
    document.querySelectorAll(".view-toggle button").forEach(b => b.classList.remove("active"));
    this.classList.add("active");
    currentView = this.dataset.view;
    const keyword = searchInput.value.trim().toLowerCase();
    const data = keyword ? allVideoList.filter(n=>n.toLowerCase().includes(keyword)) : allVideoList;
    render(data);
  });
});

function render(list){
  if(!Array.isArray(list) || list.length===0){
    box.innerHTML = `<div class="empty-tip">未找到视频</div>`;
    if(currentView === "list") box.classList.add("list-mode");
    else box.classList.remove("list-mode");
    statsEl.innerText = `共 0 个视频`;
    return;
  }
  statsEl.innerText = `共 ${list.length} 个视频`;
  
  if(currentView === "list") {
    box.classList.add("list-mode");
  } else {
    box.classList.remove("list-mode");
  }

  let html = "";
  list.forEach(filename=>{
    const src = `${CDN_BASE}/video/${filename}`;
    html += `
    <div class="video-card" data-name="${filename.toLowerCase()}">
      <video controls preload="none" playsinline>
        <source src="${src}" type="video/mp4">
        浏览器不支持该视频
      </video>
      <div class="filename">${filename}</div>
      <a class="download-btn" href="${src}" download="${filename}">下载</a>
    </div>
    `;
  });
  box.innerHTML = html;
}

async function load(){
  try{
    const listUrl = `${CDN_BASE}/video-list.json`;
    const res = await fetch(listUrl);
    allVideoList = await res.json();
    render(allVideoList);
  }catch(err){
    box.innerHTML = `<div class="empty-tip">读取失败：${err.toString()}</div>`;
    statsEl.innerText = "获取视频信息失败";
  }
}

searchInput.addEventListener("input",(e)=>{
  const kw = e.target.value.trim().toLowerCase();
  const data = kw ? allVideoList.filter(n=>n.toLowerCase().includes(kw)) : allVideoList;
  render(data);
});

load();
</script>
</body>
</html>
