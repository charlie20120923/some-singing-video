<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频列表</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#111;color:#fff;padding:16px;font-family:system-ui}
h1{text-align:center;margin-bottom:24px}
.video-item{margin-bottom:30px;background:#222;padding:12px;border-radius:8px}
video{width:100%;border-radius:6px}
.name{margin:8px 0;font-size:15px}
.loading{text-align:center;padding:40px;color:#aaa}
</style>
</head>
<body>
<h1>仓库 video 文件夹视频</h1>
<div id="box" class="loading">正在加载视频列表...</div>

<script>
const USER = "charlie20120923";
const REPO = "some-singing-video";
const BRANCH = "main";
const PROXY_VIDEO = "https://gh-proxy.org/";
const box = document.getElementById("box");

async function load(){
  try{
    // 读取同仓库生成的json，无跨域
    const res = await fetch("./video-list.json");
    const list = await res.json();
    if(!Array.isArray(list) || list.length===0){
      box.innerText = "video文件夹没有mp4文件";
      return;
    }
    let html = "";
    list.forEach(filename=>{
      const raw = `https://raw.githubusercontent.com/${USER}/${REPO}/${BRANCH}/video/${filename}`;
      const src = PROXY_VIDEO + raw;
      html += `
      <div class="video-item">
        <div class="name">${filename}</div>
        <video controls preload="metadata">
          <source src="${src}" type="video/mp4">
          浏览器不支持播放该视频
        </video>
      </div>
      `;
    })
    box.innerHTML = html;
  }catch(err){
    box.innerText = "读取失败："+err.toString();
  }
}
load();
</script>
</body>
</html>
