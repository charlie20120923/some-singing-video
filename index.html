<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>视频库</title>
<style>
@font-face {
  font-family: 'MapleMono‑CN';
  src: url('https://cdn.jsdelivr.net/gh/charlie20120923/some-singing-video/MapleMono-CN-Regular.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0a0e1a;
  color:#b0d4ff;
  padding:24px 16px;
  font-family: 'MapleMono‑CN', system-ui, monospace;
  max-width:1200px;
  margin:0 auto;
  background-image:radial-gradient(circle at 50% 0%,#0a1a3a 0%,transparent 60%);
  min-height:100vh;
}
.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
  flex-wrap:wrap;
  gap:12px;
}
.page-title{
  font-weight:400;
  font-size:24px;
  color:#4a9eff;
  text-shadow:0 0 8px #1a7aff,0 0 16px #0066ff;
}
.stats-info{
  color:#5a9eff;
  font-size:14px;
  text-shadow:0 0 5px #1a6aff;
}
.search-box{
  margin-bottom:24px;
}
#search-input{
  width:100%;
  max-width:400px;
  background:#0e1525;
  border:1px solid #2a7aff;
  color:#7ab8ff;
  padding:10px 16px;
  border-radius:10px;
  font-family: 'MapleMono‑CN', monospace;
  font-size:15px;
  outline:none;
  text-shadow:0 0 4px #2a7aff;
  box-shadow:0 0 10px #1a6aff44;
}
#search-input::placeholder{
  color:#4a7aaa;
}
.container{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
  gap:20px;
}
.video-card{
  background:#0e1525;
  border:1px solid #2a7aff44;
  border-radius:12px;
  padding:12px;
  cursor:pointer;
  transition:transform 0.2s,box-shadow 0.2s;
  text-decoration:none;
  color:inherit;
  display:block;
}
.video-card:hover{
  transform:translateY(-4px);
  box-shadow:0 0 22px #2a7aff70;
  border-color:#4a8aff;
}
.video-card .thumbnail{
  width:100%;
  aspect-ratio:16/9;
  background:#0a0f1a;
  border-radius:8px;
  overflow:hidden;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#4a7aaa;
  font-size:48px;
  border:1px solid #1a3a5a;
}
.video-card .thumbnail img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.video-card .filename{
  margin-top:10px;
  font-size:13px;
  color:#7ab8ff;
  word-break:break-all;
  text-shadow:0 0 6px #1a6aff66;
  overflow:hidden;
  text-overflow:ellipsis;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
}
.loading-wrap{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#5a9eff;
}
.spinner{
  width:42px;
  height:42px;
  border:3px solid #1a2a5a;
  border-top-color:#3a8aff;
  border-radius:50%;
  animation:spin 0.8s linear infinite;
  margin:0 auto 18px;
  box-shadow:0 0 12px #1a6aff;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}
.empty-tip{
  grid-column:1/-1;
  text-align:center;
  padding:70px 20px;
  color:#5a9eff;
}
</style>
</head>
<body>

<div class="header">
  <div class="page-title">📹 视频库</div>
  <div class="stats-info" id="stats">加载中...</div>
</div>

<div class="search-box">
  <input id="search-input" placeholder="搜索文件名...">
</div>

<div class="container" id="box">
  <div class="loading-wrap">
    <div class="spinner"></div>
    <div>读取视频列表中…</div>
  </div>
</div>

<script>
const USER = "charlie20120923";
const REPO = "some-singing-video";
const BRANCH = "main";
const CDN_BASE = `https://cdn.jsdelivr.net/gh/${USER}/${REPO}@${BRANCH}`;

const box = document.getElementById("box");
const statsEl = document.getElementById("stats");
const searchInput = document.getElementById("search-input");
let allVideoList = [];

function render(list){
  if (!Array.isArray(list) || list.length === 0) {
    box.innerHTML = `<div class="empty-tip">未找到视频</div>`;
    statsEl.innerText = "共 0 个视频";
    return;
  }
  statsEl.innerText = `共 ${list.length} 个视频`;

  let html = "";
  list.forEach(item => {
    const filename = typeof item === 'string' ? item : item.filename;
    const src = `${CDN_BASE}/video/${filename}`;
    const thumb = `${CDN_BASE}/thumbnails/${filename.replace(/\.[^.]+$/, '.jpg')}`;
    html += `
    <a class="video-card" href="player.html?id=${encodeURIComponent(filename)}">
      <div class="thumbnail">
        <img src="${thumb}" alt="${filename}" onerror="this.style.display='none';this.parentElement.innerHTML='🎬'">
      </div>
      <div class="filename">${filename}</div>
    </a>
    `;
  });
  box.innerHTML = html;
}

async function load(){
  try {
    const listUrl = `${CDN_BASE}/video-list.json`;
    const res = await fetch(listUrl);
    const data = await res.json();
    allVideoList = Array.isArray(data) ? data : [];
    render(allVideoList);
  } catch (err) {
    box.innerHTML = `<div class="empty-tip">读取失败：${err.toString()}</div>`;
    statsEl.innerText = "获取视频信息失败";
  }
}

searchInput.addEventListener("input", (e) => {
  const kw = e.target.value.trim().toLowerCase();
  if (!kw) {
    render(allVideoList);
    return;
  }
  const data = allVideoList.filter(item => {
    const filename = typeof item === 'string' ? item : item.filename;
    return filename.toLowerCase().includes(kw);
  });
  render(data);
});

load();
</script>
</body>
</html>
